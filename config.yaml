# ─────────────────────────────────────────────
# 뉴스 레이더 이메일 알림 설정
# ─────────────────────────────────────────────

email:
  # 정기 발송 시각 (24시간 기준, KST)
  scheduled_hour: 9
  scheduled_minute: 0

  # 즉시 발송 트리거 키워드
  # 이 키워드가 기사 제목/본문에 포함되면 즉시 이메일 발송
  urgent_keywords:
    - "결함"
    - "리콜"
    - "출시 연기"
    - "배터리 화재"
    - "긴급"
    - "단종"
    - "소송"
    - "폭발"
    - "사망"
    - "recall"
    - "defect"
    - "delay"

  # 리포트에 포함할 TOP N 기사 수
  top_articles_count: 5

report:
  # 긍정 판별 키워드
  positive_keywords:
    - "출시"
    - "신제품"
    - "혁신"
    - "성장"
    - "개선"
    - "수주"
    - "흑자"
    - "돌파"
    - "획득"
    - "성공"
    - "최초"
    - "세계 최고"
    - "1위"
    - "협력"
    - "양산"
    - "launch"
    - "record"

  # 부정 판별 키워드
  negative_keywords:
    - "결함"
    - "리콜"
    - "연기"
    - "화재"
    - "소송"
    - "하락"
    - "단종"
    - "적자"
    - "감소"
    - "실패"
    - "취약"
    - "문제"
    - "논란"
    - "recall"
    - "defect"
    - "delay"
    - "lawsuit"
